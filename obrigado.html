<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Você está na lista — Suporte S/light</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@1&display=swap" rel="stylesheet" />
<style>
  @font-face { font-family: 'Gilroy'; src: url('fonts/Gilroy-Regular.woff2') format('woff2'); font-weight: 400; }
  @font-face { font-family: 'Gilroy'; src: url('fonts/Gilroy-Medium.woff2') format('woff2'); font-weight: 500; }
  @font-face { font-family: 'Gilroy'; src: url('fonts/Gilroy-Semibold.woff2') format('woff2'); font-weight: 600; }
  @font-face { font-family: 'Gilroy'; src: url('fonts/Gilroy-Bold.woff2') format('woff2'); font-weight: 700; }
  :root { --yellow: #EFE625; --offwhite: #F5F6F6; --ink: #101010; --blue: #0032A0; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Gilroy', Helvetica, sans-serif; color: var(--ink);
    min-height: 100vh; display: flex; align-items: center; justify-content: center;
    padding: 8px; background: var(--offwhite);
  }
  .card {
    position: relative; overflow: hidden; width: 100%; min-height: calc(100vh - 16px);
    border-radius: 16px; display: flex; align-items: center; justify-content: center;
    background: linear-gradient(223deg, #F5F6F6 0%, #F2EF98 30%, #EFE625 100%);
  }
  .ring { position: absolute; border-radius: 50%; width: 620px; aspect-ratio: 1;
    background: radial-gradient(circle, rgba(217,217,217,0) 62%, var(--yellow) 78%, rgba(239,230,37,0) 96%); }
  .ring.a { top: -180px; right: -120px; } .ring.b { bottom: -220px; left: -160px; }
  .content { position: relative; z-index: 1; text-align: center; max-width: 640px; padding: 64px 28px; display: flex; flex-direction: column; align-items: center; gap: 26px; }
  .pill { background: var(--blue); color: #fff; font-size: 13px; letter-spacing: .12em; text-transform: uppercase; font-weight: 500; padding: 9px 16px; border-radius: 40px; }
  h1 { font-size: clamp(34px, 4.5vw, 54px); line-height: 1.05; font-weight: 500; letter-spacing: -.018em; }
  h1 em { font-family: 'Instrument Serif', Georgia, serif; font-style: italic; font-weight: 400; }
  p { font-size: 17px; line-height: 1.6; color: rgba(16,16,16,.64); max-width: 460px; }
  .btn {
    display: inline-flex; align-items: center; gap: 10px; text-decoration: none;
    min-height: 56px; padding: 16px 32px; border-radius: 40px;
    background: var(--ink); color: var(--yellow); font-size: 16px; font-weight: 600;
    transition: transform .25s ease, background .25s ease;
  }
  .btn:hover { background: #000; transform: translateY(-2px); }
  .wordmark { font-weight: 700; font-size: 20px; }
  .wordmark em { font-family: 'Instrument Serif', Georgia, serif; font-weight: 400; }
</style>
</head>
<body>
  <div class="card">
    <span class="ring a"></span><span class="ring b"></span>
    <div class="content">
      <span class="wordmark">Suporte <em>S/light</em></span>
      <span class="pill">Inscrição confirmada</span>
      <h1>Sua vaga está garantida. Agora, o passo <em>vital</em>:</h1>
      <p>O link da transmissão ao vivo do dia 27/10, às 20h, será enviado no Grupo VIP. Quem está fora do grupo, não recebe.</p>
      <a class="btn" href="https://chat.whatsapp.com/SEULINKAQUI" target="_blank" rel="noopener">Acesse o Grupo VIP do WhatsApp para receber o link da aula ao vivo →</a>
    </div>
  </div>
</body>
</html>
